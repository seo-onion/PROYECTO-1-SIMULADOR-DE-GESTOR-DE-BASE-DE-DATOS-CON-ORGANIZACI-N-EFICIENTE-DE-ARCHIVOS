<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DB Engine Explorer - Max Signal</title>
    <style>
        :root {
            --bg: #0d1117;
            --panel: #161b22;
            --border: #30363d;
            --text: #c9d1d9;
            --accent: #58a6ff;
            --success: #238636;
            --error: #da3633;
            --warning: #d29922;
            --code: #79c0ff;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Top Bar Stats */
        header {
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 10px 20px;
            justify-content: space-between;
            flex-shrink: 0;
        }

        h1 { font-size: 1.1rem; margin: 0; color: var(--accent); }
        .stats-hud { display: flex; gap: 20px; font-size: 0.85rem; }
        .stat-item span { color: var(--accent); font-weight: bold; }

        /* Main Container */
        main {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            overflow: hidden;
            padding: 15px;
            gap: 15px;
        }

        /* Editor Area */
        .editor-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-shrink: 0;
        }

        textarea {
            width: 100%;
            height: 120px;
            background: #010409;
            color: var(--code);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 12px;
            font-family: inherit;
            font-size: 0.9rem;
            resize: none;
            outline: none;
        }

        .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-run {
            background: var(--success);
            color: white;
            border: none;
            padding: 8px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
        }

        /* Data Explorer Area */
        .data-section {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 15px;
            flex-grow: 1;
            overflow: hidden;
        }

        .results-container {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .results-header {
            padding: 8px 15px;
            border-bottom: 1px solid var(--border);
            background: rgba(255,255,255,0.03);
            font-size: 0.8rem;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }

        .scroll-area {
            flex-grow: 1;
            overflow: auto;
            padding: 0;
        }

        /* Tables with wrapping */
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
            table-layout: fixed; /* Crucial para el control de ancho */
        }

        th {
            position: sticky;
            top: 0;
            background: #161b22;
            text-align: left;
            padding: 10px;
            border-bottom: 2px solid var(--border);
            color: var(--accent);
            z-index: 10;
            width: 150px; /* Ancho base */
        }

        td {
            padding: 10px;
            border-bottom: 1px solid var(--border);
            word-wrap: break-word;      /* Salto de línea para strings largos */
            overflow-wrap: break-word;  /* Compatibilidad extra */
            white-space: normal;        /* Permite saltos */
            vertical-align: top;
        }

        tr:hover { background: rgba(88, 166, 255, 0.05); }

        /* Sidebar: Info & JSON */
        .info-sidebar {
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
        }

        .info-panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 12px;
        }

        .info-panel h3 { font-size: 0.75rem; margin-top: 0; color: #8b949e; text-transform: uppercase; }

        .catalog-item {
            font-size: 0.75rem;
            border-bottom: 1px solid var(--border);
            padding: 5px 0;
        }

        .json-inspect {
            font-size: 0.7rem;
            color: #8b949e;
            white-space: pre-wrap;
            word-break: break-all;
        }

        /* Console */
        .console {
            height: 120px;
            background: #010409;
            border-top: 1px solid var(--border);
            padding: 8px 15px;
            overflow-y: auto;
            font-size: 0.75rem;
            flex-shrink: 0;
        }

        .log-entry { margin-bottom: 2px; }
        .log-success { color: #3fb950; }
        .log-error { color: #f85149; }
        .log-warn { color: #d29922; }

    </style>
</head>
<body>
    <header>
        <h1>DB_ENGINE_EXPLORER_V3</h1>
        <div class="stats-hud">
            <div class="stat-item">DISK_R: <span id="hudReads">0</span></div>
            <div class="stat-item">DISK_W: <span id="hudWrites">0</span></div>
            <div class="stat-item">MS: <span id="hudTime">0.00</span></div>
        </div>
    </header>

    <main>
        <section class="editor-section">
            <textarea id="sqlInput" spellcheck="false" placeholder="-- Escribe SQL..."></textarea>
            <div class="actions">
                <span id="statusText" style="font-size: 0.8rem; color: #8b949e;">Ready.</span>
                <button class="btn-run" onclick="executeSQL()">EJECUTAR [CTRL+ENTER]</button>
            </div>
        </section>

        <section class="data-section">
            <div class="results-container">
                <div class="results-header">
                    <span id="resInfo">No data to display</span>
                    <span id="resTime"></span>
                </div>
                <div class="scroll-area" id="mainOutput">
                    <div style="padding: 20px; color: #8b949e; text-align: center;">Ejecuta una consulta para ver resultados tabulares.</div>
                </div>
            </div>

            <div class="info-sidebar">
                <div class="info-panel">
                    <h3>Schema Catalog</h3>
                    <div id="catalogList">Loading...</div>
                </div>
                <div class="info-panel" style="flex-grow: 1;">
                    <h3>Raw Engine Response</h3>
                    <div id="rawJson" class="json-inspect">{}</div>
                </div>
            </div>
        </section>
    </main>

    <div class="console" id="console">
        <div class="log-entry">> System initialized. Waiting for input.</div>
    </div>

    <script>
        const API = window.location.origin;

        // Shortcuts
        document.addEventListener('keydown', e => {
            if (e.ctrlKey && e.key === 'Enter') executeSQL();
        });

        window.onload = refreshCatalog;

        function log(msg, type = '') {
            const c = document.getElementById('console');
            const d = document.createElement('div');
            d.className = `log-entry ${type ? 'log-'+type : ''}`;
            d.innerText = `> ${msg}`;
            c.appendChild(d);
            c.scrollTop = c.scrollHeight;
        }

        async function refreshCatalog() {
            try {
                const r = await fetch(`${API}/tables`);
                const d = await r.json();
                if (d.ok) {
                    const list = document.getElementById('catalogList');
                    list.innerHTML = d.tables.map(t => `
                        <div class="catalog-item">
                            <b style="color:var(--accent)">${t.name}</b> (${t.row_count} recs)
                        </div>
                    `).join('') || 'Empty Database';
                    log(`Catalog updated: ${d.tables.length} tables.`, 'success');
                } else {
                    log(`Engine Error: ${d.error}`, 'error');
                }
            } catch (e) {
                log(`Connection Lost: ${e.message}`, 'error');
            }
        }

        async function executeSQL() {
            const sql = document.getElementById('sqlInput').value.trim();
            if (!sql) return;

            document.getElementById('statusText').innerText = 'Processing...';
            log(`SQL: ${sql}`);

            try {
                const t0 = performance.now();
                const r = await fetch(`${API}/query`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ sql })
                });

                const d = await r.json();
                const latency = (performance.now() - t0).toFixed(2);

                document.getElementById('rawJson').innerText = JSON.stringify(d, null, 2);

                if (d.ok) {
                    const res = d.results[0];
                    updateHUD(d.stats);
                    renderData(res);
                    refreshCatalog();
                    log(`Execution finished in ${latency}ms (Total).`, 'success');
                } else {
                    log(`Query Failed: ${d.detail || JSON.stringify(d)}`, 'error');
                }
            } catch (e) {
                log(`Critical Failure: ${e.message}`, 'error');
            } finally {
                document.getElementById('statusText').innerText = 'Idle.';
            }
        }

        function updateHUD(s) {
            document.getElementById('hudReads').innerText = s.disk_reads;
            document.getElementById('hudWrites').innerText = s.disk_writes;
            document.getElementById('hudTime').innerText = s.execution_ms.toFixed(2);
        }

        function renderData(res) {
            const out = document.getElementById('mainOutput');
            const info = document.getElementById('resInfo');
            
            info.innerText = `Op: ${res.operation.toUpperCase()}`;
            
            if (res.operation === 'select') {
                info.innerText += ` | Rows: ${res.count}`;
                if (res.rows.length === 0) {
                    out.innerHTML = '<div style="padding:20px">No results.</div>';
                    return;
                }

                const keys = Object.keys(res.rows[0]).filter(k => k !== '_db_offset');
                let h = '<table><thead><tr>';
                keys.forEach(k => h += `<th>${k}</th>`);
                h += '</tr></thead><tbody>';

                res.rows.forEach(row => {
                    h += '<tr>';
                    keys.forEach(k => {
                        let val = row[k];
                        if (typeof val === 'object') val = JSON.stringify(val);
                        h += `<td>${val}</td>`;
                    });
                    h += '</tr>';
                });
                h += '</tbody></table>';
                out.innerHTML = h;
            } else {
                out.innerHTML = `
                    <div style="padding:20px">
                        <h2 style="color:var(--success)">Operation Successful</h2>
                        <pre style="color:var(--code)">${JSON.stringify(res, null, 2)}</pre>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
